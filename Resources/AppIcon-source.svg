<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Mark's icon artwork: a marker-signed M. The ink filter roughens clean strokes into a hand-drawn line.
       AppIcon.icns = this, rendered at 1648px, clipped into the macOS 824/1024 rounded square with a soft shadow. -->
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="9" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="grit"/>
      <feDisplacementMap in="w" in2="grit" scale="4" xChannelSelector="R" yChannelSelector="G" result="g"/>
      <feGaussianBlur in="g" stdDeviation="1.3" result="b"/>
      <feComponentTransfer in="b"><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#0b0b0b"/>
  <g filter="url(#ink)" transform="translate(500 515) scale(0.98) translate(-500 -520)" fill="none" stroke="#f2efe8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246,700 L326,318 L478,602 L606,318 L676,700 C694,760 760,762 806,712" stroke-width="44"/>
    <path d="M214,812 Q520,768 812,798" stroke-width="26"/>
  </g>
</svg>
